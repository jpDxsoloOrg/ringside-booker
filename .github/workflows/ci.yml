name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Reports known vulnerabilities in runtime dependencies without failing the build.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Checks docs/blog and docs/dev-journal against the MDX and public content rules. The
      # private banned-terms list comes from a repository secret; on PRs from forks the secret is
      # empty, and the missing list is reported as a warning instead of failing the build.
      - name: Check blog and journal content
        id: blog-check
        run: npm run blog:check
        env:
          BLOG_BANNED_TERMS: ${{ secrets.BLOG_BANNED_TERMS }}

      - name: Test with coverage
        run: npm test -- --coverage

      # Runs the roster fixture 60 days twice from the same start and fails if the two runs end in
      # different worlds (exit 1) or any step fails (--strict). Then times a year on the 300-person
      # roster, the baseline the README records.
      - name: Headless runner determinism check
        run: npm run sim -- --days 60 --check-determinism --strict

      - name: Headless runner one-year timing
        run: npm run sim -- --days 365 --strict

      # Checks the shipped world against every content rule and the committed real-name blocklist
      # (content/blocklist/real-names.txt). It needs no secrets, so it runs the same on pull
      # requests from forks.
      - name: Validate world content
        run: npm run validate:world -- --strict

      - name: Build
        run: npm run build

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: e2e
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pull requests and pushes to main run the same three projects, WebKit phone included, so a
      # pull request cannot pass on Chromium alone and leave main failing on WebKit.
      E2E_WEBKIT: '1'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Runs on a cache hit too: the browsers are skipped, but the system libraries still install.
      - name: Install Playwright browsers and system dependencies
        run: npm run e2e:install -w @ringside/web

      - name: Run end-to-end tests (desktop, phone and WebKit phone)
        run: npm run e2e -w @ringside/web -- --project=desktop --project=phone --project=phone-webkit

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
