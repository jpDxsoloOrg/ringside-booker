name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Reports known vulnerabilities in runtime dependencies without failing the build.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Checks docs/blog and docs/dev-journal against the MDX and public content rules. The
      # private banned-terms list comes from a repository secret; on PRs from forks the secret is
      # empty, and the missing list is reported as a warning instead of failing the build.
      - name: Check blog and journal content
        id: blog-check
        run: npm run blog:check
        env:
          BLOG_BANNED_TERMS: ${{ secrets.BLOG_BANNED_TERMS }}

      - name: Test with coverage
        run: npm test -- --coverage

      - name: Build
        run: npm run build

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
