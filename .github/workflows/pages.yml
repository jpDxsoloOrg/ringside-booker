name: Deploy to GitHub Pages

# Publishes the web app to https://jpdxsoloorg.github.io/ringside-booker/ after every push to main.
# The app is static: the engine runs in a Web Worker and saves stay in each browser.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build under the project-site path
        run: npm run build
        env:
          RB_BASE_PATH: /ringside-booker/

      # GitHub Pages has no SPA rewrites. Serving index.html as the 404 page lets deep links and
      # reloads such as /ringside-booker/game/office boot the app, and the router takes it from there.
      - name: Add the SPA fallback page
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
