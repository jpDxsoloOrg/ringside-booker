version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Minor and patch updates arrive as one grouped PR per dependency type. A major update of a
    # runtime dependency still gets its own PR, outside the groups.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    # Major versions (toolchain and runtime alike: TypeScript, ESLint, Vitest, Vite, React,
    # React Router, Zustand, ...) are upgraded on purpose in their own ticket, never by a bot PR.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
