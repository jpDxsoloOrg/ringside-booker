<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" width="720" height="640" role="img" aria-labelledby="loop-title loop-desc">
  <title id="loop-title">The booking loop</title>
  <desc id="loop-desc">Eight boxes in a ring, joined by arrows going clockwise: book a card, matches rated, show scored, popularity moves, crowds, TV and sponsors, money, roster and production, better shows, and back to book a card. A dashed border around the ring says every rival promotion runs the same loop.</desc>
  <defs>
    <marker id="arrow-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="640" fill="#ffffff"/>

  <!-- Dashed outer ring: the rival promotions -->
  <rect x="12" y="64" width="696" height="560" rx="36" fill="none" stroke="#6b7280" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="360" y="42" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-style="italic" fill="#374151">Every rival promotion runs the same loop</text>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#111827" text-anchor="middle">
    <!-- Top row, left to right -->
    <rect x="36" y="100" width="196" height="100" rx="14" fill="#fde68a" stroke="#1f2937" stroke-width="3"/>
    <text x="134" y="159">Book a card</text>

    <rect x="262" y="100" width="196" height="100" rx="14" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/>
    <text x="360" y="143">Matches</text>
    <text x="360" y="175">rated</text>

    <rect x="488" y="100" width="196" height="100" rx="14" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/>
    <text x="586" y="143">Show</text>
    <text x="586" y="175">scored</text>

    <!-- Middle row: right, then left -->
    <rect x="488" y="290" width="196" height="100" rx="14" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/>
    <text x="586" y="333">Popularity</text>
    <text x="586" y="365">moves</text>

    <rect x="36" y="290" width="196" height="100" rx="14" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/>
    <text x="134" y="333">Better</text>
    <text x="134" y="365">shows</text>

    <!-- Bottom row, right to left -->
    <rect x="488" y="480" width="196" height="100" rx="14" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/>
    <text x="586" y="523">Crowds, TV</text>
    <text x="586" y="555">and sponsors</text>

    <rect x="262" y="480" width="196" height="100" rx="14" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/>
    <text x="360" y="539">Money</text>

    <rect x="36" y="480" width="196" height="100" rx="14" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/>
    <text x="134" y="523">Roster and</text>
    <text x="134" y="555">production</text>
  </g>

  <!-- Centre label -->
  <text x="360" y="332" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#374151">You book</text>
  <text x="360" y="362" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#374151">one promotion</text>

  <!-- Arrows, clockwise -->
  <g stroke="#1f2937" stroke-width="4" fill="none" marker-end="url(#arrow-head)">
    <line x1="234" y1="150" x2="258" y2="150"/>
    <line x1="460" y1="150" x2="484" y2="150"/>
    <line x1="586" y1="202" x2="586" y2="286"/>
    <line x1="586" y1="392" x2="586" y2="476"/>
    <line x1="486" y1="530" x2="462" y2="530"/>
    <line x1="260" y1="530" x2="236" y2="530"/>
    <line x1="134" y1="478" x2="134" y2="394"/>
    <line x1="134" y1="288" x2="134" y2="204"/>
  </g>
</svg>
